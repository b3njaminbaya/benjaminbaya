<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" />

    <!-- Light by default; dark only when the visitor has chosen it with the toggle.
         Runs before first paint so there is no flash of the wrong theme. -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          if (localStorage.getItem('theme') === 'dark') {
            d.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0d12');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!--head:start-->

    <meta
      name="description"
      content="Benjamin Baya helps businesses build, automate and grow with technology: websites, web and mobile apps, business systems, AI automation, SEO and digital growth."
    />
    <link rel="canonical" href="https://benjaminbaya.com/" />
    <!--head:end-->
  </head>

  </body>
</html>
